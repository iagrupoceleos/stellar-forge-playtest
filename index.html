<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#060a14" />
    <meta name="description" content="Build a galactic industrial empire — from a single mining drone to a galaxy-spanning Dyson swarm. An idle climb that runs instantly in your browser." />
    <title>Stellar Forge</title>

    <!-- PWA: installable + instant/offline repeat launches (§H.1.3). Absolute paths are base-rebased
         by Vite (like the module script below), so they resolve under '/' and '/stellar-forge-demo/'. -->
    <link rel="manifest" href="/stellar-forge-playtest/manifest.webmanifest" />
    <!-- Cozy-cosmos favicon (ADR-0017): crisp SVG first (modern browsers), PNG fallback. -->
    <link rel="icon" type="image/svg+xml" href="/stellar-forge-playtest/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/stellar-forge-playtest/favicon-32.png" />
    <link rel="apple-touch-icon" href="/stellar-forge-playtest/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stellar Forge" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!--
      Layer contract per ADR-0009 / ADR-0012b:
      #game-root hosts the Pixi.js v8 world canvas (world + Forge + frame driver, z-bottom, opaque);
      #hud-overlay is the SIBLING vanilla-DOM HUD chrome (z-top,
      pointer-events: none on the container — interactive elements opt back in).
      The optional lazy 3D orbit view mounts between them (#orbit-root, injected on demand).
      The composition root (demo/main.ts) constructs and wires all of it (ADR-0006).
    -->
    <script type="module" crossorigin src="/stellar-forge-playtest/assets/index-CFaaEMQb.js"></script>
    <link rel="stylesheet" crossorigin href="/stellar-forge-playtest/assets/index-D9qKJAnR.css">
  </head>
  <body>
    <div id="game-root"></div>
    <div id="hud-overlay" aria-live="off"></div>
  </body>
</html>
