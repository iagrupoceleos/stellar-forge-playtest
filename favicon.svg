    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="#0b1026"/>
  <circle cx="32" cy="32" r="21" fill="#35e0c8" opacity="0.15"/>
  <path d="M32 11 L50 21.5 L50 42.5 L32 53 L14 42.5 L14 21.5 Z"
